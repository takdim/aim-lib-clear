{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">📚</span>
            <h1 class="auth-title">Masuk ke Sistem</h1>
            <p class="auth-subtitle">Gunakan Email atau NIM untuk login</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="identifier" class="form-label">Email / NIM</label>
                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    class="form-input"
                    placeholder="contoh@email.com atau 123456789"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="toggle-password" data-target="password" aria-label="Tampilkan password">
                        👁
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Masuk</button>
        </form>

        <div class="auth-footer">
            <p>Belum punya akun? <a href="{{ url_for('auth.register') }}" class="link">Daftar Sekarang</a></p>
        </div>
    </div>
</div>
{% endblock %}
